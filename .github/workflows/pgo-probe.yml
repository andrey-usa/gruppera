name: pgo-probe

# Minimal diagnostic: does GraalVM --pgo produce a binary at all here?
# (The bench-200m PGO rung keeps logging "Finished generating" with no binary.)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: PGO smoke test
        run: |
          set +e
          curl -sSL -o /tmp/graalvm.tar.gz \
            https://download.oracle.com/graalvm/21/latest/graalvm-jdk-21_linux-x64_bin.tar.gz
          tar -xzf /tmp/graalvm.tar.gz -C /tmp
          NI=$(echo /tmp/graalvm-jdk-21*)/bin/native-image
          "$NI" --version
          mkdir -p probe && cd probe
          cat > HelloWorld.java <<'EOF'
          public class HelloWorld {
              public static void main(String[] args) {
                  long s = 0;
                  for (int i = 0; i < 1000000; i++) s += i;
                  System.out.println("sum=" + s);
              }
          }
          EOF
          javac HelloWorld.java
          echo "--- instrumented build ---"
          "$NI" --pgo-instrument -o hw-instr HelloWorld
          echo "instr exit: $?"
          ls -la hw-instr
          echo "--- training run ---"
          ./hw-instr
          echo "training exit: $?"
          ls -la *.iprof
          echo "--- pgo build (bare --pgo) ---"
          "$NI" --pgo -o hw-pgo HelloWorld
          echo "pgo build exit: $?"
          ls -la hw-*
          echo "--- run pgo binary ---"
          ./hw-pgo || echo "RUN FAILED"
          echo "=== discriminator: --enable-preview + --pgo ==="
          "$NI" --enable-preview --pgo-instrument -o hw-instr-prev HelloWorld
          echo "instr-prev exit: $?"
          ./hw-instr-prev > /dev/null
          echo "training exit: $?"
          ls -la *.iprof
          "$NI" --enable-preview --pgo -o hw-pgo-prev HelloWorld
          echo "pgo-prev build exit: $?"
          ls -la hw-pgo-prev || echo "PHANTOM REPRODUCED with --enable-preview"
          echo "=== discriminator 2: --pgo + -O3 ==="
          "$NI" --enable-preview --pgo -O3 -o hw-pgo-o3 HelloWorld
          echo "pgo-o3 build exit: $?"
          ls -la hw-pgo-o3 || echo "PHANTOM REPRODUCED with -O3"
